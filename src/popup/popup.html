<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      color-scheme: light;
      --popup-bg: #f4f6f8;
      --popup-surface: #ffffff;
      --popup-surface-hover: #f1f5f9;
      --popup-panel: #f9fafb;
      --popup-text: #1f2937;
      --popup-text-strong: #0f172a;
      --popup-muted: #64748b;
      --popup-border: #d7dde5;
      --popup-focus-ring: #60a5fa;
      --popup-accent: #1f6feb;
      --popup-accent-hover: #1158c7;
      --popup-accent-text: #ffffff;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --popup-bg: #202124;
      --popup-surface: #17191c;
      --popup-surface-hover: #26292d;
      --popup-panel: #202329;
      --popup-text: #eceff3;
      --popup-text-strong: #f8fafc;
      --popup-muted: #b4bac1;
      --popup-border: #34373d;
      --popup-focus-ring: #38bdf8;
      --popup-accent: #7dd3fc;
      --popup-accent-hover: #38bdf8;
      --popup-accent-text: #0f1115;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      margin: 0;
      background: var(--popup-bg);
      color: var(--popup-text);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--popup-border);
      border-radius: 24px;
      transition: 0.3s;
    }
    .toggle .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.3s;
    }
    .toggle input:checked + .slider {
      background-color: var(--popup-accent);
    }
    .toggle input:checked + .slider:before {
      transform: translateX(20px);
    }
    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 0;
    }
    .setting-row label {
      color: var(--popup-muted);
      font-size: 13px;
    }
    .setting-row select {
      width: 100%;
      font: inherit;
      padding: 6px 8px;
      border: 1px solid var(--popup-border);
      border-radius: 6px;
      background: var(--popup-surface);
      color: var(--popup-text);
    }
    .theme-row {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .theme-row > span {
      color: var(--popup-muted);
      font-size: 13px;
    }
    .segmented-control {
      display: inline-flex;
      align-items: center;
      background: var(--popup-bg);
      border: 1px solid var(--popup-border);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
      margin: 0;
    }
    .segmented-control label {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      color: var(--popup-muted);
      transition: all 0.15s ease-out;
    }
    .segmented-control label:hover {
      color: var(--popup-text-strong);
    }
    .segmented-control input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .segmented-control input[type="radio"]:checked + svg {
      color: var(--popup-text-strong);
    }
    .segmented-control label:has(input[type="radio"]:checked) {
      background: var(--popup-surface);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      cursor: default;
    }
    .segmented-control input[type="radio"]:focus-visible + svg {
      outline: 2px solid var(--popup-focus-ring);
      border-radius: 2px;
    }
    .studio-button {
      width: 100%;
      margin-top: 12px;
      padding: 8px 10px;
      border: 1px solid var(--popup-accent);
      border-radius: 6px;
      background: var(--popup-accent);
      color: var(--popup-accent-text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .studio-button:hover {
      background: var(--popup-accent-hover);
      border-color: var(--popup-accent-hover);
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      background: var(--popup-panel);
      border: 1px solid var(--popup-border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--popup-muted);
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🎵</span>
    <h1>ChatMusic</h1>
  </div>

  <div class="toggle-row">
    <span>Enable detection</span>
    <label class="toggle">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row theme-row">
    <span>Theme</span>
    <form id="themeModeForm" class="segmented-control" aria-label="Theme mode" title="Theme mode">
      <label>
        <input type="radio" name="themeMode" value="auto" title="Auto Theme">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
        <span class="visually-hidden">Auto</span>
      </label>
      <label>
        <input type="radio" name="themeMode" value="light" title="Light Theme">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <span class="visually-hidden">Light</span>
      </label>
      <label>
        <input type="radio" name="themeMode" value="dark" title="Dark Theme">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <span class="visually-hidden">Dark</span>
      </label>
    </form>
  </div>

  <div class="setting-row">
    <label for="codeBlockVisibilitySelect">Source code</label>
    <select id="codeBlockVisibilitySelect">
      <option value="expanded">Show by default</option>
      <option value="collapsed">Collapse by default</option>
    </select>
  </div>

  <div class="setting-row">
    <label for="keyboardVisibilitySelect">Keyboard</label>
    <select id="keyboardVisibilitySelect">
      <option value="visible">Show by default</option>
      <option value="hidden">Hide by default</option>
    </select>
  </div>

  <button class="studio-button" id="openStudioButton" type="button">
    Open ABC Studio
  </button>

  <div class="status" id="status">
    Detecting ABC notation on this page...
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
